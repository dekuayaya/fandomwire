<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Noticias · FandomWire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#edebf8">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" defer></script>
</head>
<body data-page="news">
  <header id="site-header"></header>
  <main id="main">
    <div class="wrap">
      <div class="page-head">
        <h1>Noticias</h1>
        <p>Resúmenes de lo último en series, música y videojuegos. Con una cuenta gratis lees cada noticia completa.</p>
      </div>
      <div class="filters" role="search">
        <label class="sr-only" for="f-section">Sección</label><select id="f-section"></select>
        <label class="sr-only" for="f-topic">Tema</label><select id="f-topic"></select>
        <label class="sr-only" for="f-q">Buscar</label><input id="f-q" type="search" placeholder="Buscar noticias…">
        <span class="muted small" id="news-count" aria-live="polite"></span>
      </div>
      <div class="grid grid--news" id="news-grid"></div>
      <p style="text-align:center;margin-top:28px"><button class="btn btn--ghost" type="button" id="news-more" hidden>Cargar más</button></p>
      <div class="block" id="news-gate" hidden>
        <div class="gate sec-series"><div><h3>¿Quieres leerlas completas?</h3><p>Crea tu cuenta gratis y desbloquea todas las noticias, además de la biblioteca de assets.</p></div>
        <div class="hero__cta"><a class="btn" href="/login.html?tab=register&next=/noticias.html">Crear cuenta</a><a class="btn" href="/login.html?next=/noticias.html">Iniciar sesión</a></div></div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
</body>
</html>
