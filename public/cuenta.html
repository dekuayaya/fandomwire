<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi cuenta · FandomWire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <meta name="theme-color" content="#edebf8">
  <script src="/js/theme.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <script src="/js/app.js" defer></script>
</head>
<body data-page="account">
  <header id="site-header"></header>
  <main id="main">
    <div class="wrap">
      <div class="page-head"><h1>Mi cuenta</h1></div>
      <section class="panel" id="profile-panel" aria-labelledby="pp-h"><h2 id="pp-h">Mi perfil</h2><div id="profile-edit"><div class="skeleton"></div></div></section>
      <div class="mission">
        <div>
          <section class="panel"><h2>Resumen</h2><div id="account-info"></div></section>
          <section class="panel"><h2>Mis pedidos</h2><div id="orders"></div></section>
        </div>
        <div>
          <section class="panel">
            <h2>Cambiar contraseña</h2>
            <form id="pw-form">
              <div class="field"><label for="pw-cur">Contraseña actual</label><input id="pw-cur" name="current" type="password" autocomplete="current-password" required></div>
              <div class="field"><label for="pw-new">Contraseña nueva</label><input id="pw-new" name="next" type="password" autocomplete="new-password" minlength="8" required><small>Mínimo 8 caracteres.</small></div>
              <p class="form-error" id="pw-msg" role="alert"></p>
              <button class="btn btn--accent" type="submit">Guardar contraseña</button>
            </form>
          </section>
        </div>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>
  <script src="/js/profile-edit.js" defer></script>
</body>
</html>
